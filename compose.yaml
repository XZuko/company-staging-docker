name: company-staging

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    image: ${REGISTRY:-local}/company-api:${APP_VERSION:-local}
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=database,1433;Database=CompanyStaging;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=True
    depends_on:
      database:
        condition: service_healthy
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-local}/company-web:${APP_VERSION:-local}
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  smoke-test:
    image: curlimages/curl:8.10.1
    profiles: [test]
    depends_on:
      gateway:
        condition: service_healthy
    networks: [app]
    command: ["-fsS", "--retry", "5", "--retry-connrefused", "http://gateway/api/todos"]

networks:
  app:
  data:
    internal: true

volumes:
  sql-data:

